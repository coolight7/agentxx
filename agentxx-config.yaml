# Agentxx 配置文件
# 使用方式: agentxx_cli --config agentxx-config.yaml [train|acp]
#
# key 字段支持 ${VAR} 环境变量占位符，会在运行时被真实环境变量替换。
# 查找顺序: 系统环境变量 > .env 文件变量 > 保留 ${VAR} 原样
#
# 可选的 .env 文件（--env 指定文件/当前目录/配置文件同目录）:
#   LLM_API_KEY=sk-your-key-here

models:
  # 声明模型，[name] 取 [default] 仅是自定义名称，并不会被默认使用，应当在 [use_model] 中指定
  - name: full_example
    type: "openai" # 模型类型，根据 api 类型选择 openai 或 anthropic
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    model_name: "qwen3.8-max-preview"
    send_thinking: true
    connect_timeout: 30 # seconds 建立连接时的超时限制 
    read_timeout: 30 # seconds 接收数据时，超过该时长`未收到新数据`时判断为响应超时，即相邻数据间隔应当小于该时长
    model_support_max_token: 262144 # 模型支持的最大上下文 token 数；不指定时上下文压缩使用默认值 256k
    extra_api_config:
      stream: true

  - name: qwenai-qwen3.8-max-preview
    type: "openai"
    base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api_key: "${QWENAI_API_KEY}"
    model_name: "qwen3.8-max-preview"
    send_thinking: true
    model_support_max_token: 1000000
    extra_api_config:
      stream: true
  - name: opencode-ds-v4-flash
    type: "openai"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY}"
    model_name: "deepseek-v4-flash"
    model_support_max_token: 1000000
    extra_api_config:
      stream: true
  - name: local
    type: "openai"
    base_url: "http://172.29.48.1:7070/v1"
    api_key: "EMPTY"
    model_name: "Agentxx"
    model_support_max_token: 1000000
    extra_api_config:
      stream: true

  # ACP 服务模型
  - name: acp
    type: "openai"
    base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api_key: "${QWENAI_API_KEY}"
    model_name: "deepseek-v4-flash"
    extra_api_config: {}

  # 训练主模型
  - name: train
    type: "openai"
    base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api_key: "${QWENAI_API_KEY}"
    model_name: "deepseek-v4-flash"
    extra_api_config: {}

  # 训练评分模型
  - name: train_scorer
    type: "openai"
    base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api_key: "${QWENAI_API_KEY}"
    model_name: "deepseek-v4-flash"
    extra_api_config: {}

  # 训练优化模型
  - name: train_optimizer
    type: "openai"
    base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api_key: "${QWENAI_API_KEY}"
    model_name: "deepseek-v4-flash"
    extra_api_config: {}

# 指定各模式下使用的模型名称（对应上面 models 中的 name）
use_model:
  # default: local
  # default: qwenai-qwen3.8-max-preview
  default: opencode-ds-v4-flash
  acp: acp
  # train: train
  train: local
  train_scorer: train_scorer
  train_optimizer: train_optimizer

# MCP 服务器列表
# - namespace: 该 MCP 的命名空间，应当唯一；会作为其所有 tool 的名称前缀 (格式 "namespace_toolName")
#              命名空间重复时会警告，且后出现的 url 覆盖先前的
# - url:       MCP 服务器地址
mcp_servers:
  # - namespace: musicxx
  #   url: "http://172.29.48.1:17001/mcp"
  # - namespace: exa
  #   url: "https://mcp.exa.ai"

# Skill 文件夹路径列表
# - 支持绝对路径或相对路径（相对路径按程序工作目录解析）
# - 每个文件夹下可包含多个 skill 子目录，每个子目录包含 SKILL.md
skill_dirs:
  # - "/absolute/path/to/skills"
  # - "relative/path/to/skills"

# 上下文文件路径列表
# - 支持绝对路径或相对路径（相对路径按程序工作目录解析）
# - 文件内容会在每次模型调用时注入系统提示词
memory_files:
  # - "/absolute/path/to/context.md"
  # - "relative/path/to/AGENTS.md"
  - "AGENTS.md"
