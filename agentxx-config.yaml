# Agentxx 配置文件
# 使用方式: agentxx_cli --config agentxx-config.yaml [train|acp]
#
# key 字段支持 ${VAR} 环境变量占位符，会在运行时被真实环境变量替换。
# 查找顺序: 程序内置变量 > --env 覆盖文件变量 > .env 文件变量 > 系统环境变量 > 保留 ${VAR} 原样
#
# 程序内置变量:
#   - AGENTXX_WORK_DIR: 程序启动后的工作目录 (启动时所在目录, 正斜杠格式)
#     例如: data_dir: ${AGENTXX_WORK_DIR}/.agentxx-data
#   - AGENTXX_EXEC_DIR: agentxx_cli 可执行程序所在目录 (正斜杠格式)
#     例如: 插件/数据相对 exe 目录: data_dir: ${AGENTXX_EXEC_DIR}/.agentxx-data
#
# 可选的 .env 文件（--env 指定文件/当前目录/配置文件同目录）:
#   LLM_API_KEY=sk-your-key-here
#
# 加载实现源码见 [agent/client/src/config_loader.cpp]

# === 统一数据根目录 (留空/不配置 = 不持久化数据: 设置/会话/codegraph 仅存内存,
# 重启后无法恢复; 支持 `~` 与 ${VAR} 展开, 相对路径按工作目录解析)
# 特殊关键字 `default` (仅 tui/cli 模式): 使用当前系统数据目录
#   - Linux/macOS: ~/.agentxx/
#   - Windows: %APPDATA%/agentxx/
# 配置后数据子路径:
#   - {data_dir}/sqlite/global.db                     全局设置 (TUI 动画等级/日志等级等)
#   - {data_dir}/sqlite/sessions/{threadId}/          会话数据 (session.db / share_store.db)
#   - {data_dir}/sqlite/codegraph/<折叠路径>/index.db CodeGraph 索引
# data_dir: ~/.agentxx
data_dir: default

# === 会话工作目录 (留空/不配置 = 使用进程当前工作目录, 即 agentxx_cli 启动目录)
# 支持 `~` 与 ${VAR} 展开, 相对路径按程序工作目录解析; 须为存在的目录
# 生效范围:
#   - permission.mode: ask 的默认放行范围 (该目录内读写放行, 其余询问)
#   - filesystem 工具与权限校验的相对路径解析基准 (如 "src/main.cpp")
#   - 命令执行工具 (agentxx_execute_*_command) 子进程的初始工作目录
#   - 插件宿主信息 projectRoot (如 codegraph 未配置 paths 时默认索引该目录)
# work_dir: ${AGENTXX_WORK_DIR}

# === 权限配置 (该配置项已从 TUI 设置弹窗移除, 启动时提示一次)
# - mode: 询问处理模式
#   - ask:     当前工作目录内允许读写, 其他路径询问用户 (默认)
#   - all_ask: 所有路径读写均询问用户
#   - pass:    全部放行, 不询问
#   - deny:    全部拒绝, 不询问
# - whitelist (可选路径列表; 最长前缀匹配, 支持 * 通配符;
#   相对路径按程序工作目录解析为绝对路径): 始终放行, 优先级高于 mode 默认规则
#   (如 deny 模式下白名单路径仍可访问)
# - blacklist: 始终拒绝, 与白名单同路径时黑名单优先
permission:
  mode: ask
  whitelist:
    - "/tmp/"   # linux temp dir
    - "${TEMP}" # windows temp dir
  #   - "C:/work/trusted"
  #   - "/home/user/shared/**"
  # blacklist:
  #   - "C:/secret"
  #   - "/home/user/.ssh"

subagent:
  enable: false # 未完善

# === 模型列表
models:
  # 声明模型，[name] 取 [default] 仅是自定义名称，并不会被默认使用，应当在 [use_model] 中指定
  - name: openai_full_example
    type: "openai" # 必选；模型类型，根据 api 类型选择 openai / openai-responses / anthropic
    base_url: "https://api.openai.com/v1" # 可选；默认根据 [type] 选择
    api_path: "/chat/completions" # 可选；自定义路径，默认自动根据 [type] 选择
    api_key: "${OPENAI_API_KEY}" # 可选；如果不需要验证，可以填 EMPTY 等任意字符串
    model_name: "deepseek-v4-flash" # 可选；使用的模型名称，建议填写
    model_context_max_token: 262144 # 模型支持的最大上下文 token 数；不指定时上下文压缩使用默认值 256k
    send_thinking: true # 可选，默认 false；是否发送 thinking，部分模型要求发送才能正常使用
    connect_timeout: 30 # seconds 建立连接时的超时限制
    read_chunk_timeout: 60 # seconds 接收数据时，超过该时长`未收到新数据`时判断为响应超时，即相邻数据间隔应当小于该时长
    ssl_verify: true # 是否验证 TLS 证书；不指定时使用全局默认值
    # - [max_concurrent_connections] 可选，默认 5；该模型 API 端点的最大并发连接数（0 = 不限制）。
    # LLM 请求启用 HTTP keep-alive 连接池，空闲连接复用，超过上限的并发请求排队等待
    max_concurrent_connections: 5
    extra_api_config:
      reasoning_effort: "high"

  - name: openai_response_full_example
    type: "openai-responses" # 必选；模型类型，根据 api 类型选择 openai / openai-responses / anthropic
    base_url: "https://api.openai.com/v1" # 可选；默认根据 [type] 选择
    api_path: "/responses" # 可选；自定义路径，默认自动根据 [type] 选择
    api_key: "${OPENAI_API_KEY}" # 可选；如果不需要验证，可以填 EMPTY 等任意字符串
    model_name: "deepseek-v4-flash" # 可选；使用的模型名称，建议填写
    send_thinking: true # 可选，默认 false；是否发送 thinking，部分模型要求发送才能正常使用
    # - [request_reasoning_summary] 是否响应思考内容, 默认为 [true]; send_thinking 开启时, 是否请求上游返回
    # 思考摘要 (Responses API 的 include 参数) muse-spark 等不支持 reasoning.summary_text , 需设 false, 
    # 否则 API 400 (unknown variant reasoning.summary_text);
    # - 也可用 extra_api_config 显式指定 include 数组覆盖
    request_reasoning_summary: true 
    connect_timeout: 30 # seconds 建立连接时的超时限制
    read_chunk_timeout: 60 # seconds 接收数据时，超过该时长`未收到新数据`时判断为响应超时，即相邻数据间隔应当小于该时长
    ssl_verify: true # 是否验证 TLS 证书；不指定时使用全局默认值
    # - [max_concurrent_connections] 可选，默认 5；该模型 API 端点的最大并发连接数（0 = 不限制）。
    # LLM 请求启用 HTTP keep-alive 连接池，空闲连接复用，超过上限的并发请求排队等待
    max_concurrent_connections: 5
    model_context_max_token: 1000000 # 模型支持的最大上下文 token 数；不指定时上下文压缩使用默认值 256k
    extra_api_config:
      # - 可选; 思考强度，"none|minimal|low|medium|high|xhigh|max" 
      # 并非所有模型支持的选项都一样，可能有的支持 xhigh 有的支持 max
      # 可以改一个值然后启动聊聊天，如果请求失败再修改试试
      reasoning:
        effort: high 

  - name: opencode-muse-spark-1.2-contributor
    type: "openai-responses"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY}"
    model_name: "muse-spark-1.2-contributor"
    send_thinking: true
    request_reasoning_summary: false
    model_context_max_token: 1000000
    extra_api_config:
      reasoning:
        effort: xhigh
  - name: opencode-ds-v4-flash
    type: "openai-responses"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY}"
    model_name: "deepseek-v4-flash"
    send_thinking: true
    model_context_max_token: 1000000
    extra_api_config:
      reasoning:
        effort: max
  - name: opencode-ds-v4-pro
    type: "openai-responses"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY}"
    model_name: "deepseek-v4-pro"
    send_thinking: true
    model_context_max_token: 1000000
    extra_api_config:
      reasoning:
        effort: max
  - name: opencode-gpt-5.6-luna
    type: "openai-responses"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY}"
    model_name: "gpt-5.6-luna"
    # 注意: 该模型上游不支持 include:["reasoning.summary_text"],
    # send_thinking 必须为 false (否则会触发 HTTP 400 invalid_prompt)
    send_thinking: false
    model_context_max_token: 1000000
    extra_api_config:
      reasoning:
        effort: max
  - name: gemini-3.7-flash-high-responses
    type: "openai-responses"
    base_url: "http://172.29.48.1:8317/v1"
    api_key: "${GEMINI_API_KEY}"
    model_name: "gemini-3.7-flash-high"
    model_context_max_token: 1000000
    send_thinking: true
    extra_api_config:
      reasoning:
        effort: max
  - name: opencode-glm-5.3
    type: "openai"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY}"
    model_name: "glm-5.3"
    model_context_max_token: 1000000
    send_thinking: true
    extra_api_config:
      reasoning_effort: "max"
  - name: local
    type: "openai"
    base_url: "http://172.29.48.1:7070/v1"
    api_key: "EMPTY"
    model_name: "Agentxx"
    model_context_max_token: 128000
    send_thinking: true
    extra_api_config:
      reasoning_effort: "max"
      preserve_thinking: true 

# 指定各模式下使用的模型名称（对应上面 models 中的 name）
use_model:
  # default: local
  # default: opencode-ds-v4-flash
  default: opencode-muse-spark-1.2-contributor
  subagent: local
  acp: local
  train: local
  train_scorer: local
  train_optimizer: local

# MCP 服务器列表
# - namespace: 该 MCP 的命名空间，应当唯一；会作为其所有 tool 的名称前缀 (格式 "namespace_toolName")
#              命名空间重复时会警告，且后出现的 url 覆盖先前的
# - url:       MCP 服务器地址
mcp:
  # - namespace: musicxx
  #   url: "http://172.29.48.1:17001/mcp"
  - namespace: exa
    url: "https://mcp.exa.ai"

# Skill 文件夹路径列表
# - 支持绝对路径或相对路径（相对路径按程序工作目录解析）
# - 每个文件夹下可包含多个 skill 子目录，每个子目录包含 SKILL.md
skill:
  # - "/absolute/path/to/skills"
  # - "relative/path/to/skills"

# 上下文文件路径列表
# - 支持绝对路径或相对路径（相对路径按程序工作目录解析）
# - 文件内容会在每次模型调用时注入系统提示词
memory:
  # - "/absolute/path/to/context.md"
  # - "relative/path/to/AGENTS.md"
  - "AGENTS.md"
  - ".agentxx/memory/self.md"

# 插件配置: 所有插件统一经 path 外置指定加载 (不区分内置/外置插件)
#
# - path: 插件动态库路径 或 插件目录 (目录含 plugin.yaml 时按清单分派, 推荐);
#         必填; 相对路径按程序工作目录解析为绝对路径
# - enabled: 是否启用 (默认 true; false 跳过加载)
# - args:    插件参数 json (整体传递给插件, 宿主不解析其字段语义;
#            参数含义由插件自行定义)
# - 依赖排序: 加载时按 manifest depends 拓扑排序 (脚本插件须在引擎之后,
#   配置顺序无关 —— 即使脚本插件写在引擎前面也会自动排到后面)
#
# 形态一: 插件目录 (含 plugin.yaml; entry 指向动态库, depends 声明依赖)
#   plugins/example_js/ 为 JS 示例插件 (C++ 壳 + plugin.js), depends:
#   agentxx_javascript_engine (JS 解释器引擎, 需同时配置)
# 形态二: 直接库路径 (无 plugin.yaml; 插件名按文件名推导 libfoo.so → foo)
#   示例插件编译产物: agent/build/linux-debug/exec/plugins/libexample_plugin.so
#   引擎插件编译产物: agent/build/linux-debug/exec/plugins/libagentxx_javascript_engine.so
# 形态三 (内置合并编译): 顶层构建加 -DAGENTXX_ENABLE_PLUGIN_BUILTIN=ON 后,
#   插件源文件编译进 libagentxx (无插件动态库); 配置仍写插件目录路径
#   (plugin.yaml 资源照常拷贝), 入口文件缺失时自动回退内置注册表加载;
#   也可显式写 builtin://插件名 (无资源需求的插件/测试直连用)
plugins:
  # --- 示例: 原生 C++ 插件 (直接库路径) ---
  # - path: "${AGENTXX_EXEC_DIR}/plugins/example_plugin"
  #   enabled: true
  #   args: { foo: bar }

  # --- 示例: 禁用 (加载时跳过) ---
  # - path: "${AGENTXX_EXEC_DIR}/plugins/example_plugin"
  #   enabled: false

  # --- 示例: JS 插件 (引擎 + 脚本插件; 顺序无关, 拓扑排序自动处理) ---
  # - path: "${AGENTXX_EXEC_DIR}/plugins/agentxx_javascript_engine"
  #   enabled: true
  # - path: "${AGENTXX_EXEC_DIR}/plugins/example_js"
  #   enabled: true

  # --- 示例: Windows 桌面控制 (screen_capture 捕获 + computer_use 控制;
  #   须同时配置, computer_use 的 plugin.yaml depends 声明依赖 screen_capture) ---
  # - path: "${AGENTXX_EXEC_DIR}/plugins/agentxx_screen_capture"
  #   enabled: true
  # - path: "${AGENTXX_EXEC_DIR}/plugins/agentxx_computer_use"
  #   enabled: true

  # === CodeGraph 代码分析 (插件 agentxx_codegraph; 默认关闭)
  # - 参数经 yaml `plugins` 段 path 条目携带 (宿主只整体传递 args json,
  #   不解析其字段语义):
  #     paths:          加载(索引)路径列表 (可选; 相对路径按程序工作目录解析)
  #     ignore_paths:   忽略路径列表 (支持 * 通配符; 命中即跳过)
  #     load_cwd:       未配置 paths 时是否默认加载当前工作目录 (默认 true)
  #     use_gitignore:  是否默认忽略 .gitignore 规则与 .gitmodules 子模块目录 (默认 true)
  # - 索引数据库: {data_dir}/sqlite/codegraph/<折叠路径>/index.db
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_codegraph/
    enabled: true
    args:
      # paths:
      #   - "/path/to/project_a"
      #   - "relative/path/to/project_b"
      ignore_paths:
        - "**/build/**"
        - "**/node_modules/**"
      load_cwd: true
      use_gitignore: true

  # === 系统资源监控 (插件 agentxx_system_monitor; 从 lib expand 拆分, 默认开启)
  # - 工具: agentxx_get_system_core_info (原内置工具迁移, 同名同行为;
  #   lib 不再内置, 未配置本插件时该工具不可用)
  # - 能力: agentxx.system_usage (方法 query) —— TUI 侧边栏 System 段
  #   (WireGetSystemUsage 周期请求) 经服务端调用本能力采集 CPU/内存/GPU;
  #   载荷 schema 由本插件定义, 宿主只透传 (lib wire 层无系统资源 DTO)
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_system_monitor/
    enabled: true

  # === 编程工具插件 (从 lib 内置工具迁移, 同名同行为; 默认全部开启) ===
  # - lib 内置实现已移除, 未配置对应插件时该工具不可用
  # - 构建期也可经 AGENTXX_ENABLE_PLUGIN_BUILTIN=ON + AGENTXX_PLUGIN_BUILTIN_LIST
  #   把它们合并编译进 libagentxx (内置注册表), 运行期配置保持不变
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_planning/
    enabled: true
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_filesystem/
    enabled: true
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_execute_command/
    enabled: true
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_string/
    enabled: true
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_system/
    enabled: true
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_websearch/
    enabled: true
  - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_rag_search/
    enabled: true

  # === 音频流捕获 (插件 agentxx_audio_stream; 从 lib expand 拆分, 默认关闭)
  # - 工具: agentxx_audio_stream (start/stop/status; 仅 Windows 支持捕获,
  #   其他平台 start 返回失败)
  # - 捕获帧经事件推送 (topic agentxx_audio_stream.audio)
  # - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_audio_stream/
  #   enabled: true

  # === 系统级文本选择事件流 (插件 agentxx_text_selection_monitor;
  #   从 lib expand 拆分, 默认关闭; 仅 Windows 支持)
  # - 工具: agentxx_text_selection_monitor (start/stop/status)
  # - 选中文本经事件推送 (topic agentxx_text_selection_monitor.selection)
  # - path: ${AGENTXX_EXEC_DIR}/plugins/agentxx_text_selection_monitor/
  #   enabled: true
