# example_js —— JS 示例插件 (统一插件模型)
# 所有插件统一为 C++ 插件: entry 指向本插件的 C++ 壳 (libexample_js.so),
# 壳经能力调用把 plugin.js 交给 interpreter.js 引擎执行
# depends: 必选依赖 —— agentxx_javascript_engine 未安装时本插件加载失败
name: example_js
version: 1.0.0
description: "Example JS plugin: C++ shell + JS via interpreter.js capability"
entry: libexample_js.so
depends:
  - agentxx_javascript_engine
enabled: true
