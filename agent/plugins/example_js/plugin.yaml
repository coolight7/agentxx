# example_js —— 纯脚本插件 (只有清单与 plugin.js, 没有动态库)
#
# 清单写 `kind: js`: 主程序不再要求动态库, 而是把插件目录交给提供 `js` 形态的
# 运行器插件 (`agentxx_javascript_engine`) 执行 `plugin.js`。脚本里的工具 / 订阅 /
# 界面项都由运行器代本插件登记, 卸载本插件时整批撤销。
#
# depends: 必选依赖 —— 引擎插件没装或没启用时, 本插件报"缺运行器"而不会被加载。
# interfaces: 脚本用 `agentxx.side` 区分两侧动作, 所以两侧接口都声明。
name: example_js
version: 1.0.0
description: "Example JS plugin: scripts only (kind: js, executed by the javascript engine)"
kind: js
depends:
  - agentxx_javascript_engine
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.client.msg_decor
