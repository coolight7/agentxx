name: agentxx_rag_search
version: 1.0.0
description: "RAG semantic search tool (agentxx_rag_search): embedding based knowledge base search over configured docs paths"
entry: libagentxx_rag_search.so
depends:
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.agent.tools
  optional:
    - agentxx.agent.model
    # 网络经主程序 `<应用名>.net` 表; 清单里不写进 require —— 无前缀名字两侧都检查,
    # 写进 require 会让本插件也被当成 client 端插件去加载
    - agentxx.net
