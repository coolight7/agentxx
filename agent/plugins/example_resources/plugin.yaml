name: example_resources
version: 1.0.0
description: "Example plugin contributing skill/memory/mcp resources"
entry: libexample_resources.so
depends:
# 接口协商: 会话资源注册 (skill/memory/mcp) 属核心接口范围
interfaces:
  require:
    - agentxx.agent.core
# ---- 会话资源声明段 (相对插件目录解析, entry 成功后由主程序应用) ----
# - 列表项 `type` 由主程序定义 (agentxx 认 skill / memory / mcp), 框架只解析
#   `type` / `path` / `args`; 其余字段原样以 JSON 交给主程序
# - 与主配置 yaml 冲突时跳过并告警 (主程序 yaml 优先)
resources:
  - type: skill
    path: skills
  - type: memory
    path: assets/NOTES.md
  # 示例条目: URL 为保留域名 (.invalid), 连接会失败 —— 仅用于演示失败路径
  # (异步连接失败仅记日志, 命名空间随即释放可重试)
  - type: mcp
    args:
      namespace: example_time
      url: https://mcp.time.example.invalid/sse
      timeout: 10
