name: agentxx_websearch
version: 1.0.0
description: "Web tools: search (agentxx_web_search, api url / model driven), fetch url raw (agentxx_web_fetch) / markdown (agentxx_web_fetch_markdown)"
entry: libagentxx_websearch.so
depends:
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.agent.tools
  optional:
    - agentxx.agent.model
    # 工具消息特化渲染 (client 入口经 ui 表 register_tool_renderer 注册折叠头/展开体):
    # 无消息渲染面的宿主 (cli) 不支持时注册被拒绝, 工具按通用样式展示
    - agentxx.client.msg_decor
