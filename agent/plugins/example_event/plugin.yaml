name: example_event
version: 2.0.0
description: "Example broadcast plugin: declares channels, publishes values, subscribes, reads, ends streams"
entry: libexample_event.so
interfaces:
  require:
    - agentxx.agent.core
  # 广播表 (`agentxx.broadcasts`) 是通用表: 两侧主程序都提供, 但谨慎起见这里不写成 require
  # —— 第三方精简主程序可以不带广播表, 插件里的 `broadcasts iface unavailable` 分支会空转。
