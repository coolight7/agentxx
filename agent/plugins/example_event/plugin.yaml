name: example_event
version: 2.0.0
description: "Example broadcast plugin: declares channels, publishes values, subscribes, reads, ends streams"
entry: libexample_event.so
interfaces:
  require:
    - agentxx.agent.core
  # 广播表 (`agentxx.broadcasts`) 是通用表: 主程序有就用, 没有就空转 (见 example_event.cpp 的
  # "broadcasts iface unavailable" 分支)。客户端侧要到步骤 5 才提供这张表, 因此这里先不声明
  # 为 require —— 声明了会让客户端加载前的接口协商把它判成"本侧不支持"。
