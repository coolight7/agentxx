name: agentxx_execute_command
version: 1.0.0
description: "Command execution tools: agentxx_execute_bash_command, agentxx_execute_windows_command (PowerShell/cmd via WSL interop); probes python/node/PowerShell at plugin start and injects the results into the tool prompts"
entry: libagentxx_execute_command.so
depends:
# ---- 接口协商 (按前缀归属侧: agent.* 仅 agent 侧检查, client.* 仅 client 侧) ----
# - agentxx.agent.prompt: 插件在 start 事务注入自身工具的提示词 (depict + 参数
#   描述, 含启动时探测到的 python/node 与 PowerShell 信息); 宿主按所有者记录
#   贡献, 插件卸载/禁用时自动撤销
# - agentxx.client.msg_decor: client 入口经 ui 表 register_tool_renderer 注册
#   折叠头/展开体 (工具消息特化渲染); 无消息渲染面的宿主 (cli) 不支持时注册
#   被拒绝, 工具按通用样式展示
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.agent.tools
    - agentxx.agent.prompt
  optional:
    - agentxx.agent.config
    - agentxx.agent.cancel
    - agentxx.client.msg_decor
