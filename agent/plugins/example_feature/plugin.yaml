name: example_feature
version: 1.0.0
description: "Example feature-point plugin: declares a point, implements host points, calls points"
entry: libexample_feature.so
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.agent.feature
  # 钩子表属可选能力: 主程序不支持有序登记成员时插件不登记 (加载照常成功)
  optional:
    - agentxx.agent.hooks
