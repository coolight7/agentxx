name: agentxx_filesystem
version: 1.0.0
description: "Filesystem tools: list (agentxx_filesystem_list), read (agentxx_filesystem_read), write (agentxx_filesystem_write), edit (agentxx_filesystem_edit), glob (agentxx_filesystem_glob), grep (agentxx_filesystem_grep)"
entry: libagentxx_filesystem.so
depends:
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.agent.tools
  optional:
    - agentxx.agent.config
    - agentxx.agent.cancel
    # 工具消息特化渲染 (client 入口经 ui 表 register_tool_renderer 注册折叠头/展开体):
    # 无消息渲染面的宿主 (cli) 不支持时注册被拒绝, 工具按通用样式展示
    - agentxx.client.msg_decor
