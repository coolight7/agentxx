name: agentxx_filesystem
version: 1.0.0
description: "Filesystem tools: list (agentxx_filesystem_list), read (agentxx_filesystem_read), read_media (agentxx_filesystem_read_media), write (agentxx_filesystem_write), edit (agentxx_filesystem_edit), glob (agentxx_filesystem_glob), grep (agentxx_filesystem_grep)"
entry: libagentxx_filesystem.so
depends:
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.agent.tools
  optional:
    - agentxx.agent.config
    - agentxx.agent.cancel
    # 工具行内容 (client 入口在 agentxx.client.tool 上注册声明项 + 内容):
    # 无消息渲染面的主程序 (cli) 不支持时注册被拒绝, 工具按通用样式展示
    - agentxx.client.msg_decor
