name: example_plugin
version: 1.0.0
description: "Example native plugin"
entry: libexample_plugin.so
depends:
# ---- 接口协商示例 ----
# - require 声明 agentxx.client.command (斜杠命令输入管线): 无命令输入面的主程序
#   (位未置/清单未声明) 将跳过本插件, 而非加载后半失效
# - optional 声明 toast: 缺失仅警告, 插件注册时降级
# - client 侧状态栏 / Info 栏 / 面板都是槽位上的界面内容, 不单独声明能力
interfaces:
  require:
    - agentxx.agent.core
    - agentxx.client.command
  optional:
    - agentxx.client.toast
